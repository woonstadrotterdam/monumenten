name: Benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "benchmarks/**"
      - ".github/workflows/benchmark.yml"

permissions:
  contents: read
  pull-requests: write

# Een nieuwe push annuleert de lopende meting op dezelfde PR
concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  meten:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Eén meting tegelijk voor alle PR's, zodat ze niet samen de Kadaster-limiet opmaken
    concurrency:
      group: benchmark-kadaster

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Meet basis en kandidaat
        env:
          BASIS: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: python3 benchmarks/snelheid.py --basis "$BASIS" --kandidaat "$GITHUB_SHA" --uitvoer benchmark.md --ruwe-data benchmark.json

      - name: Zet rapport in job summary
        if: always() && hashFiles('benchmark.md') != ''
        run: cat benchmark.md >> "$GITHUB_STEP_SUMMARY"

      # Dependabot-PR's krijgen alleen leesrechten; daar blijft het bij de job summary
      - name: Plaats of werk PR-comment bij
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- monumenten-snelheid -->"))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@benchmark.md > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@benchmark.md > /dev/null
          fi

      - name: Bewaar ruwe metingen
        if: always() && hashFiles('benchmark.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmark.json
