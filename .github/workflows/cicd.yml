name: CICD

on:
  workflow_dispatch:
  schedule:
    # Dagelijks om 08:30 Nederlandse tijd: tests/test_client.py bevraagt de echte
    # API's van Kadaster en Cultureel Erfgoed, dus dit vangt wijzigingen aan hun kant.
    - cron: "30 8 * * *"
      timezone: "Europe/Amsterdam"
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  CI:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # De dagelijkse run test de externe API's, niet onze code: één versie volstaat.
        python-version: ${{ github.event_name == 'schedule' && fromJSON('["3.13"]') || fromJSON('["3.11", "3.12", "3.13", "3.14"]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pre-commit environment
        if: github.event_name != 'schedule'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pre-commit
            ./.pre-commit
          key: ${{ runner.os }}-precommit-${{ hashFiles('.pre-commit-config.yaml') }}-${{ matrix.python-version }}
          restore-keys: |
            ${{ runner.os }}-precommit-${{ matrix.python-version }}-
            ${{ runner.os }}-precommit-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
        env:
          PYTHONPATH: src # Ensure src is in the PYTHONPATH

      - name: Run pre-commit hooks
        if: github.event_name != 'schedule'
        run: pre-commit run --all-files

      - name: Run pytest
        env:
          PYTHONPATH: src # Ensure src is in the PYTHONPATH
        run: python -m pytest
